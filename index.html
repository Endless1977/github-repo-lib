<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repo Bibliotheek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bibliotheek-console — vaste kop met tabs, filterkolom links, raster van "cartridges" rechts */
:root{
  --bg:#eef1ef; --panel:#ffffff; --sunk:#e3e8e5; --line:#cfd8d4; --fg:#13201f; --mute:#566764;
  --game:#b25f00; --game-soft:#f6e3c8; --app:#0f7a72; --app-soft:#cdebe7;
  --ok:#2f7d32; --warn:#9a5b00; --off:#7b7f86;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1416; --panel:#151d20; --sunk:#0b1012; --line:#26343a; --fg:#e4ece9; --mute:#8d9e9b;
  --game:#f0a443; --game-soft:#3a2a14; --app:#5cc6bd; --app-soft:#123331;
  --ok:#7cc47f; --warn:#e7b25c; --off:#8b9096; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1416; --panel:#151d20; --sunk:#0b1012; --line:#26343a; --fg:#e4ece9; --mute:#8d9e9b;
  --game:#f0a443; --game-soft:#3a2a14; --app:#5cc6bd; --app-soft:#123331;
  --ok:#7cc47f; --warn:#e7b25c; --off:#8b9096; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body.apps{--acc:var(--app);--acc-soft:var(--app-soft)} body{--acc:var(--game);--acc-soft:var(--game-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:22px;height:22px;display:inline-grid;grid-template-columns:1fr 1fr;gap:2px}
.brand i b{background:var(--game);border-radius:1px}.brand i b:nth-child(2),.brand i b:nth-child(3){background:var(--app)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:8px}
.tab{border:0;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.tab[aria-selected="true"] span{color:var(--acc)}
.tab span{font-family:var(--mono);font-size:12px;margin-left:6px;font-weight:500}
.search{flex:1 1 260px;display:flex;gap:8px;min-width:0}
.search input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.status{font-family:var(--mono);font-size:12px;color:var(--mute);padding-block:0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.status b{color:var(--fg);font-weight:500}
.status .live{color:var(--acc)}

main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding-block:20px 60px}
aside{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;padding-right:6px}
.fg h3{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--fg)}
.chip[aria-pressed="true"] small{color:var(--fg)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.row output{font-family:var(--mono);font-size:12px;color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start;font-size:13px}
.ftoggle{display:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.toolbar h2{font-family:var(--display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.toolbar h2 span{font-family:var(--mono);font-size:14px;color:var(--mute);font-weight:400;margin-left:8px}
.toolbar select{width:auto}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.active .chip{background:var(--acc-soft);border-color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.cov{aspect-ratio:16/8;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h) 55% 26%),hsl(calc(var(--h) + 50) 60% 14%))}
.cov::before{content:"";position:absolute;inset:0;opacity:.35}
.cov.px::before{background:conic-gradient(from 90deg at 50% 50%,#fff2 25%,#0000 0 50%,#fff2 0 75%,#0000 0) 0 0/14px 14px}
.cov.d3::before{background:repeating-linear-gradient(90deg,#fff3 0 1px,#0000 1px 28px),repeating-linear-gradient(0deg,#fff3 0 1px,#0000 1px 18px);transform:perspective(160px) rotateX(55deg) scale(2.2) translateY(20%)}
.cov.vx::before{background:linear-gradient(30deg,#fff2 12%,#0000 12.5% 87%,#fff2 87.5%),linear-gradient(150deg,#fff2 12%,#0000 12.5% 87%,#fff2 87.5%),linear-gradient(90deg,#0002 2px,#0000 2px) 0 0/34px 20px;background-size:34px 20px}
.cov.tx::before{background:repeating-linear-gradient(0deg,#fff2 0 2px,#0000 2px 9px)}
.cov.d2::before{background:radial-gradient(circle at 20% 70%,#fff3 0 18%,#0000 19%),radial-gradient(circle at 80% 25%,#fff2 0 12%,#0000 13%)}
.cov.ap::before{background:linear-gradient(#fff2 1px,#0000 1px) 0 0/100% 22px}
.mono{position:relative;font-family:var(--display);font-weight:700;font-size:44px;color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 #0005;text-transform:uppercase}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#000a;color:#fff}
.bdg.beta{background:#e7b25c;color:#1d1300}.bdg.mp{background:#5cc6bd;color:#00201d}.bdg.arc{background:#8b9096;color:#111}.bdg.mine{background:#fff;color:#111}.bdg.new{background:#ff5d8f;color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cb h4{margin:0;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.own{font-family:var(--mono);font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
.desc{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--fg)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;gap:10px}
.launch{font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;text-decoration:none;white-space:nowrap}
.launch.on{background:var(--acc);color:#111}
.launch.ins{border:1px solid var(--line);color:var(--fg)}
.more{display:flex;justify-content:center;margin-top:22px}
.empty{padding:40px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}

.ov{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:100%;overflow:auto}
.dlg .cov{aspect-ratio:16/5}
.dlg .in{padding:18px 22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--display);margin:0;font-size:26px;overflow-wrap:anywhere}
.dlg p{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:12px}
.facts div{font-size:13px;min-width:0;overflow-wrap:anywhere}.facts span{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:6px;background:var(--acc-soft);color:var(--fg);display:grid;place-items:center}
.steps strong{display:block;margin-bottom:3px}
pre{margin:6px 0 0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;position:relative;white-space:pre}
.copy{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 7px}
.dlg .x{float:right}
.note{font-size:13px;color:var(--mute);background:var(--sunk);border-radius:8px;padding:10px 12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none}
textarea{width:100%;min-height:110px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;color:var(--fg)}
.log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--mute)}

/* screenshots */
.cov img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .25s}
.cov.has::after{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#0000 40%,#0000 70%,#0007);pointer-events:none}
.cov.has .badges,.cov.has .shotn,.cov.has .dots{z-index:2}
.shotn{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:10.5px;background:#000b;color:#fff;padding:2px 6px;border-radius:4px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;opacity:0;transition:opacity .2s}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6}.dots i.on{background:#fff}
.card:hover .dots{opacity:1}.card:hover .shotn{opacity:0}
.gal{display:flex;flex-direction:column;gap:8px;background:#000;padding-bottom:8px}
.gal .main{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;cursor:zoom-in;overflow:hidden;position:relative}
.gal .main img{width:100%;height:100%;object-fit:contain}
.gal .main .shotn{bottom:8px;right:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:0 8px}
.thumbs button{flex:0 0 auto;width:96px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#222;cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:40;background:#000e;display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:88vh;margin:auto;display:block;object-fit:contain}
.lb .nav{width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0008;color:#fff;font-size:22px;cursor:pointer}
.lb .lbx{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#0008;color:#fff;border-color:#fff4}
.lb .cnt{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--mono);font-size:12px}

@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;overflow:visible;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  aside.closed{display:none}
  .ftoggle{display:inline-block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="bar">
   <div class="brand"><i><b></b><b></b><b></b><b></b></i>Repo Bibliotheek</div>
   <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-game" aria-selected="true" data-k="game">Spellen<span id="n-game"></span></button>
    <button class="tab" role="tab" id="tab-app" aria-selected="false" data-k="app">Apps<span id="n-app"></span></button>
   </div>
   <div class="search">
    <input id="q" type="search" placeholder="Zoek op naam, beschrijving of onderwerp…" autocomplete="off">
    <button class="btn" id="scanBtn" title="Haal actuele repositories op bij GitHub">Live scannen</button>
   </div>
  </div>
  <div class="status" id="status"></div>
 </div>
</header>

<div class="wrap">
 <main>
  <aside id="side"></aside>
  <section>
   <div class="toolbar">
    <h2 id="heading"></h2>
    <div style="display:flex;gap:8px;align-items:center">
     <button class="btn ftoggle" id="ftoggle">Filters</button>
     <label for="sort" style="color:var(--mute);font-size:13px">Sorteer</label>
     <select id="sort">
      <option value="stars">Meeste sterren</option>
      <option value="pushed">Recent bijgewerkt</option>
      <option value="new">Nieuwste eerst</option>
      <option value="old">Oudste eerst</option>
      <option value="added">Nieuw toegevoegd</option>
      <option value="name">Naam A–Z</option>
     </select>
    </div>
   </div>
   <div class="active" id="active"></div>
   <div class="grid" id="grid"></div>
   <div class="more"><button class="btn" id="moreBtn" hidden>Meer tonen</button></div>
  </section>
 </main>
</div>
<div id="overlay"></div>

<script>
const NOW = Date.now();
let DATA = [];

/* ---------- classificatie ---------- */
const rx = words => new RegExp('(^|[^a-z0-9])(' + words.map(w => w.replace(/[.+]/g,'\\$&')).join('|') + ')([^a-z0-9]|$)', 'i');
const GENRES = {
 'Actie & shooter':['shooter','shmup','fps','shoot-em-up','bullet-hell','action','dogfight','shoot','tps','hack-and-slash','beat-em-up'],
 'Platformer':['platformer','platform-game','metroidvania','jump-and-run'],
 'Puzzel':['puzzle','puzzle-game','sokoban','tetris','match-3','2048','sudoku','minesweeper','wordle','word-game'],
 'RPG':['rpg','role-playing','role-playing-game','mmorpg','jrpg','rpg-game'],
 'Roguelike':['roguelike','roguelite','dungeon-crawler','dungeon'],
 'Strategie':['strategy','rts','4x','tower-defense','turn-based','tactics','strategy-game','civilization','wargame'],
 'Racen':['racing','racer','kart','driving','racing-game','race'],
 'Avontuur':['adventure','point-and-click','interactive-fiction','text-adventure','visual-novel','adventure-game'],
 'Simulatie':['simulation','simulator','city-builder','tycoon','management','farming','colony'],
 'Sandbox & survival':['sandbox','voxel','minecraft','crafting','survival','open-world'],
 'Arcade & retro':['arcade','snake','pacman','pac-man','breakout','asteroids','pong','flappy','flappy-bird','space-invaders','retro-game','arcade-game'],
 'Kaart & bord':['card-game','cards','board-game','poker','solitaire','chess','mahjong','checkers','boardgame','deck-building'],
 'Party & quiz':['party','party-game','quiz','trivia','io-game'],
 'Sport':['sports','football','soccer','golf','basketball','tennis','pool','billiards'],
 'Ritme & muziek':['rhythm','rhythm-game','music-game','osu']
};
const GRX = Object.fromEntries(Object.entries(GENRES).map(([k,v])=>[k,rx(v)]));
const R = {
 mp: rx(['multiplayer','online-game','mmo','mmorpg','pvp','socket.io','socketio','websocket','websockets','networked','lan','2-player','two-player','local-multiplayer','online multiplayer','io-game','peerjs','webrtc','colyseus']),
 coop: rx(['co-op','coop','cooperative','co-operative','local-coop']),
 beta: rx(['alpha','beta','wip','work-in-progress','work in progress','prototype','early-access','early access','experimental','under development','in development','in progress','unfinished','pre-alpha','demo','game-jam','gamejam','ludum-dare','js13k']),
 g3d: rx(['3d','three.js','threejs','webgl','babylonjs','babylon.js','unreal','unreal-engine','opengl','vulkan','3d-game','raytracing','fps']),
 vox: rx(['voxel','voxels','minecraft','minecraft-like']),
 pix: rx(['pixel-art','pixelart','pixel','8-bit','8bit','16-bit','retro','nes','gameboy','pico-8','pico8']),
 txt: rx(['ascii','text-based','terminal','interactive-fiction','text-adventure','ncurses','curses','tui','console-game','mud']),
 g2d: rx(['2d','canvas','phaser','phaserjs','phaser3','pixi','pixijs','love2d','sprite','2d-game','html5-canvas','pygame','kaboom','kaplay']),
 docker: rx(['docker','docker-compose','dockerfile','kubernetes','helm','self-hosted','selfhosted','homelab']),
 web: rx(['web-app','webapp','pwa','progressive-web-app','web-application','browser','online','html5','web']),
 selfh: rx(['self-hosted','selfhosted','self-host','homelab']),
};
const ENGINES = {Godot:['godot','godot-engine','godot4','godotengine','gdscript'],Unity:['unity','unity3d','unity-game'],Phaser:['phaser','phaserjs','phaser3'],'Three.js':['three.js','threejs'],'Babylon.js':['babylonjs','babylon.js'],PixiJS:['pixi','pixijs'],'LÖVE':['love2d','love'],Bevy:['bevy','bevy-engine'],Pygame:['pygame'],Raylib:['raylib'],SDL:['sdl','sdl2'],MonoGame:['monogame','xna'],Unreal:['unreal','unreal-engine'],'Eigen code':[]};
const ERX = Object.fromEntries(Object.entries(ENGINES).filter(([,v])=>v.length).map(([k,v])=>[k,rx(v)]));
const CATS = {
 'Productiviteit':['productivity','todo','todo-app','task','tasks','kanban','calendar','time-tracking','pomodoro','planner','project-management'],
 'Notities & kennis':['note-taking','notes','markdown','wiki','knowledge-base','knowledge-management','zettelkasten','pkm','notebook','outliner','obsidian'],
 'Media & muziek':['media-server','music','music-player','video','video-player','photos','photo','podcast','streaming','jellyfin','audio','image','movies','media','tuner'],
 'Domotica':['home-automation','home-assistant','homeassistant','smart-home','smarthome','iot','mqtt','zigbee','homekit','esp32','esp8266','hacs','robotics'],
 'Ontwikkelaars':['developer-tools','devtools','cli','terminal','git','api','ide','editor','code-editor','vscode','debugging','database','json'],
 'AI':['ai','llm','chatgpt','openai','machine-learning','gpt','ollama','chatbot','llms','local-llm','rag','ai-assistant','voice-assistant'],
 'Beveiliging & privacy':['security','privacy','password-manager','encryption','vpn','adblock','2fa','totp','firewall','ad-blocker'],
 'Netwerk & server':['server','dns','proxy','reverse-proxy','monitoring','dashboard','network','homelab','uptime','observability','diagnostics'],
 'Bestanden & sync':['file-sharing','sync','backup','cloud-storage','file-manager','nextcloud','files','storage','webdav','s3'],
 'Financiën':['finance','budget','accounting','invoice','money','personal-finance','budgeting','expense-tracker'],

 'Grafisch & 3D':['blender','3d','design','drawing','graphics','diagram','whiteboard','svg']
};
const CRX = Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,rx(v)]));
const PLAT = {
 'Web':['web-app','webapp','pwa','web','browser','self-hosted','selfhosted','html','web-application'],
 'Windows':['windows','win32','electron','desktop','cross-platform','tauri','wpf','winforms'],
 'macOS':['macos','mac','osx','electron','desktop','cross-platform','tauri','swiftui'],

 'Terminal':['cli','terminal','tui','command-line','command-line-tool','shell','cli-app'],
 'Docker':['docker','docker-compose','dockerfile','self-hosted','selfhosted','kubernetes']
};
const PRX = Object.fromEntries(Object.entries(PLAT).map(([k,v])=>[k,rx(v)]));
const PERMISSIVE = ['MIT','Apache-2.0','BSD-2-Clause','BSD-3-Clause','ISC','Unlicense','0BSD','Zlib','MPL-2.0','CC0-1.0'];

const isNew = r => !!r._new || (!!r.nw && (NOW - Date.parse(r.nw)) < 14*864e5);
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function isRepoLink(u){return /^https?:\/\/(www\.)?github\.com\//i.test(u)}

function enrich(r){
 const txt = (r.n.replace(/[-_]/g,' ')+' '+r.d+' '+r.t.join(' ')).toLowerCase();
 const tt = ' '+r.t.join(' ')+' '+r.d.toLowerCase()+' ';
 r._txt = (r.f+' '+r.d+' '+r.t.join(' ')).toLowerCase();
 r.ageY = (NOW - Date.parse(r.c))/3.156e10;
 r.updM = (NOW - Date.parse(r.p))/2.63e9;
 r.status = r.a ? 'Gearchiveerd' : (R.beta.test(tt) ? 'Beta / in ontwikkeling' : 'Stabiel');
 // online-link
 let url = '';
 if (r.h && !isRepoLink(r.h)) url = r.h.startsWith('http') ? r.h : 'https://'+r.h;
 else if (r.g) url = `https://${r.o.toLowerCase()}.github.io/${r.n}/`;
 const lang = r.l || '';
 const webTech = /^(HTML|JavaScript|TypeScript|CSS|Vue|Svelte)$/.test(lang);
 r.launch = [];
 if (r.k === 'game') {
  if (url && (r.g || webTech || /itch\.io|play|game|\.io\//i.test(url) || R.web.test(tt))) { r.play = url; r.launch.push('Online speelbaar'); }
  else if (url) r.site = url;
  r.genre = Object.keys(GRX).filter(k => GRX[k].test(txt)); if(!r.genre.length) r.genre=['Overig'];
  r.mp = []; if (R.mp.test(tt) || R.coop.test(tt)) r.mp.push('Multiplayer'); if (R.coop.test(tt)) r.mp.push('Co-op'); if(!r.mp.length) r.mp.push('Geen multiplayer genoemd');
  r.gfx = []; if (R.vox.test(tt)) r.gfx.push('Voxel'); if (R.g3d.test(tt) || /^(C#|C\+\+)$/.test(lang) && /unity|unreal/.test(tt)) r.gfx.push('3D');
  if (R.pix.test(tt)) r.gfx.push('Pixel art'); if (R.txt.test(tt)) r.gfx.push('Tekst / ASCII');
  if (R.g2d.test(tt) || (!r.gfx.length && /^(JavaScript|TypeScript|HTML)$/.test(lang))) r.gfx.push('2D');
  if (!r.gfx.length) r.gfx.push('Onbekend');
  r.engine = Object.keys(ERX).filter(k => ERX[k].test(tt)); if (lang==='GDScript' && !r.engine.includes('Godot')) r.engine.push('Godot');
  if (!r.engine.length) r.engine = ['Eigen code'];
 } else {
  const webApp = R.web.test(tt) || (r.g && webTech);
  if (url && webApp) { r.play = url; r.launch.push('Online te openen'); } else if (url) r.site = url;
  r.cat = Object.keys(CRX).filter(k => CRX[k].test(txt)); if(!r.cat.length) r.cat=['Overig'];
  r.plat = Object.keys(PRX).filter(k => PRX[k].test(tt));
  if (!r.plat.length) { if (/^(Swift|Objective-C)$/.test(lang)) r.plat=['macOS','iOS']; else if (/^(Kotlin|Dart)$/.test(lang)) r.plat=['Android']; else if (lang==='C#') r.plat=['Windows']; else if (webTech) r.plat=['Web']; else r.plat=['Onbekend']; }
  r.lic = !r.li || r.li==='NOASSERTION' ? 'Geen / onduidelijk' : PERMISSIVE.includes(r.li) ? 'Vrij (MIT, Apache…)' : /GPL/.test(r.li) ? 'Copyleft (GPL)' : 'Overig';
  r.self = R.selfh.test(tt) ? 'Self-hosted' : 'Niet self-hosted';
 }
 if (R.docker.test(tt) && r.k==='app') r.launch.push('Docker');
 r.launch.push('Zelf installeren');
 r.gfxClass = r.k==='app' ? 'ap' : ({'Pixel art':'px','3D':'d3','Voxel':'vx','Tekst / ASCII':'tx','2D':'d2'})[r.gfx[0]] || 'd2';
 r.hue = r.k==='game' ? (hash(r.f)%120)+ (hash(r.f)%2?10:200) : 150 + hash(r.f)%110;
 return r;
}

const FACETS = {

 ],

  {key:'self', label:'Hosting'},
  {key:'status', label:'Status'},
  {key:'lic', label:'Licentie'},
 ]
};
const vals = (r,k) => Array.isArray(r[k]) ? r[k] : [r[k]];
const S = { newOnly:false, tab:'game', q:'', sort:'stars', minStars:0, upd:0, age:0, mine:false, sel:{}, shown:60 };
function freshSel(){ S.sel = {}; for (const f of FACETS[S.tab]) S.sel[f.key] = new Set(); S.sel.status.add('Stabiel'); S.sel.status.add('Beta / in ontwikkeling'); }

function passBase(r){
 if (r.k!==S.tab) return false;
 if (S.mine && !r.m) return false;
 if (S.newOnly && !isNew(r)) return false;
 if (r.s < S.minStars) return false;
 if (S.upd && r.updM > S.upd) return false;
 if (S.age && r.ageY > S.age) return false;
 if (S.q) { for (const w of S.q.toLowerCase().split(/\s+/)) if (w && !r._txt.includes(w)) return false; }
 return true;
}
function passFacets(r, skip){
 for (const f of FACETS[S.tab]) { if (f.key===skip) continue; const s=S.sel[f.key]; if (s.size && !vals(r,f.key).some(v=>s.has(v))) return false; }
 return true;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace('.',',')+'k' : String(n);
function ago(m){ if (m<1) return 'deze maand'; if (m<12) return Math.round(m)+' mnd geleden'; const y=m/12; return (y<1.5?'1 jaar':Math.round(y)+' jaar')+' geleden'; }

function renderSide(){

 h += `<div class="fg"><div class="chips"><button class="chip" id="mine" aria-pressed="${S.mine}">Alleen Endless1977 <small>${DATA.filter(r=>r.m&&r.k===S.tab).length}</small></button><button class="chip" id="newOnly" aria-pressed="${!!S.newOnly}">Nieuw (14 dagen) <small>${DATA.filter(r=>isNew(r)&&r.k===S.tab).length}</small></button></div></div>`;
 for (const f of FACETS[S.tab]) {
  const counts = {}; for (const r of base) if (passFacets(r,f.key)) for (const v of vals(r,f.key)) counts[v]=(counts[v]||0)+1;
  const all = new Set(DATA.filter(r=>r.k===S.tab).flatMap(r=>vals(r,f.key)));
  const order = [...all].sort((a,b)=>(counts[b]||0)-(counts[a]||0) || a.localeCompare(b));
  h += `<div class="fg"><h3>${f.label}</h3><div class="chips">` + order.map(v=>{

 }

 h += `<div class="fg"><h3>Max. leeftijd</h3><div class="row"><label for="age">Aangemaakt binnen</label><output id="ageO">${S.age?S.age+' jaar':'alles'}</output></div><input id="age" type="range" min="1" max="16" value="${S.age||16}"></div>`;
 h += `<div class="fg"><h3>Laatst bijgewerkt</h3><select id="upd">${UPD.map(([v,l])=>`<option value="${v}" ${S.upd==v?'selected':''}>${l}</option>`).join('')}</select></div>`;
 h += `<div class="fg"><h3>Populariteit</h3><div class="row"><label for="stars">Minimaal sterren</label><output id="starsO">${S.minStars?fmtN(S.minStars):'alle'}</output></div><input id="stars" type="range" min="0" max="${STAR_STEPS.length-1}" value="${si}"></div>`;
 h += `<button class="reset" id="reset">Alle filters wissen</button>`;
 document.getElementById('side').innerHTML = h;
}

/* ---------- raster ---------- */
function cover(r, big){
 const mono = r.n.replace(/[^A-Za-z0-9]/g,'').slice(0,2) || '?';
 const b = [];
 if (isNew(r)) b.push('<span class="bdg new">Nieuw</span>');
 if (r.m) b.push('<span class="bdg mine">Van jou</span>');
 if (r.status==='Gearchiveerd') b.push('<span class="bdg arc">Gearchiveerd</span>');
 else if (r.status.startsWith('Beta')) b.push('<span class="bdg beta">Beta</span>');
 if (r.mp && r.mp.includes('Multiplayer')) b.push(`<span class="bdg mp">${r.mp.includes('Co-op')?'Co-op':'Multiplayer'}</span>`);
 if (r.gfx && r.gfx[0]!=='Onbekend') b.push(`<span class="bdg">${esc(r.gfx[0])}</span>`);
 if (r.k==='app' && r.plat[0]!=='Onbekend') b.push(`<span class="bdg">${esc(r.plat.slice(0,2).join(' · '))}</span>`);
 const shots = r.i && r.i.length;
 const pic = shots ? `<img class="shot" src="${esc(r.i[0])}" alt="Screenshot van ${esc(r.n)}" loading="lazy" referrerpolicy="no-referrer" data-f="${esc(r.f)}" onerror="shotErr(this)">`
   + (r.i.length>1 ? `<span class="shotn">${r.i.length} beelden</span><div class="dots">${r.i.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>` : '') : '';
 return `<div class="cov ${r.gfxClass}${shots?' has':''}" style="--h:${r.hue}" data-cov="${esc(r.f)}">${pic}<div class="badges">${b.join('')}</div>${shots?'':`<div class="mono"${big?' style="font-size:60px"':''}>${esc(mono)}</div>`}</div>`;
}
const BYF = f => DATA.find(x=>x.f===f);
/* kapotte afbeelding: haal uit de lijst en toon de volgende, of de monogram-cover */
function shotErr(img){
 const r = BYF(img.dataset.f); if (!r || !r.i) return;
 const bad = img.getAttribute('src'); r.i = r.i.filter(u=>u!==bad);
 if (img.closest('.gal')) { renderGal(r, 0); return; }
 const cov = img.closest('.cov'); if (cov) cov.outerHTML = cover(r, !!cov.closest('.dlg'));
}
/* hover-diavoorstelling op kaarten */
let hov = null;
function startHover(cov){
 const r = BYF(cov.dataset.cov); if (!r || !r.i || r.i.length<2 || hov?.cov===cov) return;
 stopHover(); let k = 0; const img = cov.querySelector('img.shot'); const dots = cov.querySelectorAll('.dots i');
 r.i.slice(1).forEach(u=>{ const p=new Image(); p.referrerPolicy='no-referrer'; p.src=u; });
 const step = () => { k = (k+1) % r.i.length; img.src = r.i[k]; dots.forEach((d,j)=>d.classList.toggle('on', j===k)); };
 hov = {cov, t: setInterval(step, 1100), img, r}; step();
}
function stopHover(){ if (!hov) return; clearInterval(hov.t); if (hov.r.i?.length) hov.img.src = hov.r.i[0]; hov.cov.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on', !j)); hov = null; }
document.addEventListener('mouseover', e=>{ const card = e.target.closest?.('.grid .card'); if (card) { const c = card.querySelector('.cov'); if (hov && hov.cov!==c) stopHover(); startHover(c); } else stopHover(); });
document.addEventListener('mouseout', e=>{ if (!e.relatedTarget) stopHover(); });
/* galerij in detailvenster + lightbox */
let GAL = null;
function renderGal(r, k){

 k = Math.min(k, r.i.length-1); GAL = {r, k};
 g.innerHTML = `<div class="main" id="galMain" title="Klik om te vergroten"><img src="${esc(r.i[k])}" alt="Screenshot ${k+1} van ${esc(r.n)}" referrerpolicy="no-referrer" data-f="${esc(r.f)}" onerror="shotErr(this)">${r.i.length>1?`<span class="shotn">${k+1} / ${r.i.length}</span>`:''}</div>`
  + (r.i.length>1 ? `<div class="thumbs">${r.i.map((u,j)=>`<button data-th="${j}" aria-current="${j===k}" aria-label="Screenshot ${j+1}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-f="${esc(r.f)}" onerror="this.parentElement.remove()"></button>`).join('')}</div>` : '');
}
function openLB(){ if (!GAL) return; const d=document.createElement('div'); d.className='lb'; d.id='lb'; document.body.appendChild(d); drawLB(); }

/* screenshots live uit README halen (voor nieuw gescande en eigen repos) */
const SHOT_BAD = /shields\.io|badge|travis-ci|codecov|circleci|appveyor|gitter|ko-fi|buymeacoffee|patreon|paypal|liberapay|opencollective|discord|sponsor|star-history|contrib\.rocks|repobeats|trendshift|producthunt|visitor|komarev|\/logo|logo[._-]|icon|favicon|emoji|avatar|\.svg(\?|$)|app.?store|google.?play|play.?store|get-it-on|download-on|flathub|f-droid|snapcraft|license|donate|qr|nodei\.co|button|brand/i;
async function fetchShots(r){
 r._shotTry = 1;
 for (const name of ['README.md','readme.md','Readme.md']) {
  try {
   const res = await fetch(`https://raw.githubusercontent.com/${r.f}/HEAD/${name}`); if (!res.ok) continue;
   const txt = await res.text(), base = `https://raw.githubusercontent.com/${r.f}/HEAD/`;
   const urls = [...txt.matchAll(/!\[[^\]]*\]\(\s*<?([^)\s>]+)/g)].map(m=>m[1]).concat([...txt.matchAll(/<img[^>]+src\s*=\s*["']([^"']+)/gi)].map(m=>m[1]));
   const out = [];
   for (let u of urls) {
    u = u.trim(); if (u.startsWith('data:') || SHOT_BAD.test(u)) continue;
    if (u.startsWith('//')) u = 'https:'+u;
    if (!/^https?:/.test(u)) u = new URL(u.replace(/^\.\//,''), base).href;
    const m = u.match(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/(.+?)(\?.*)?$/); if (m) u = `https://raw.githubusercontent.com/${m[1]}/${m[2]}`;
    if (!/\.(png|jpe?g|gif|webp)(\?|$)|user-attachments\/assets|user-images\.githubusercontent|camo\.githubusercontent|imgur/i.test(u)) continue;
    if (!out.includes(u)) out.push(u); if (out.length>=8) break;
   }
   if (out.length) { r.i = out; const st=lsRead(); if (st[r.f]) { st[r.f].i=out; lsWrite(st); } document.querySelectorAll(`.cov[data-cov="${CSS.escape(r.f)}"]`).forEach(c=>{ if(!c.closest('.dlg')) c.outerHTML = cover(r); }); }
   return;
  } catch(e) { return; }
 }
}
const shotIO = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; shotIO.unobserve(e.target); const r=LIST[+e.target.dataset.i]; if (r && !r._shotTry && (r.live||r.m) && !(r.i&&r.i.length)) fetchShots(r); }), {rootMargin:'200px'}) : null;
function card(r, i){
 const tags = (r.k==='game'? r.genre : r.cat).filter(x=>x!=='Overig').slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
 const launch = r.play ? `<a class="launch on" href="${esc(r.play)}" target="_blank" rel="noopener" data-stop>${r.k==='game'?'▶ Speel online':'Open web-app'}</a>`
   : `<span class="launch ins">${r.launch.includes('Docker')?'Docker':'Installeren'}</span>`;
 return `<article class="card" data-i="${i}" tabindex="0"><div>${cover(r)}</div><div class="cb">
  <h4>${esc(r.n.replace(/[-_]/g,' '))}</h4><div class="own">${esc(r.o)}${r.l?' · '+esc(r.l):''}</div>
  <p class="desc">${esc(r.d)||'<i>Geen beschrijving</i>'}</p><div class="tags">${tags}</div>
  <div class="foot"><div class="meta"><span title="Sterren">★ ${fmtN(r.s)}</span><span title="Laatst bijgewerkt ${r.p}">${ago(r.updM)}</span></div>${launch}</div></div></article>`;
}
let LIST = [];

 if (shotIO) g.querySelectorAll('.card').forEach(c=>shotIO.observe(c));

 // actieve filters

/* ---------- detail ---------- */
function buildSteps(r){
 const repo = `https://github.com/${r.f}`;
 const steps = [];
 if (r.play) steps.push(`<li><div><strong>${r.k==='game'?'Direct spelen in je browser':'Direct openen in je browser'}</strong>Niets installeren nodig.<div class="links" style="margin-top:6px"><a class="btn pri" href="${esc(r.play)}" target="_blank" rel="noopener">${r.k==='game'?'▶ Speel nu':'Open'} — ${esc(r.play.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a></div></div></li>`);
 steps.push(`<li><div><strong>Kant-en-klare download</strong>Veel projecten zetten een installer of zip klaar onder Releases. Kijk daar eerst, dat scheelt zelf bouwen.<div class="links" style="margin-top:6px"><a class="btn" href="${repo}/releases" target="_blank" rel="noopener">Releases bekijken</a></div></div></li>`);
 if (r.launch.includes('Docker')) steps.push(`<li><div><strong>Met Docker op je eigen server</strong>Geschikt voor een Raspberry Pi of NAS. De README noemt meestal een kant-en-klaar <code>docker-compose.yml</code>.<pre>git clone ${repo}.git\ncd ${r.n}\ndocker compose up -d<button class="btn copy">Kopieer</button></pre></div></li>`);
 const l = r.l||'', cl = `git clone ${repo}.git\ncd ${r.n}\n`;
 let cmd='', how='Volg de bouwinstructies in de README.';
 if (l==='HTML'||l==='CSS') { cmd = cl+'# open index.html in je browser\n# of: python -m http.server 8000'; how='Puur HTML: na downloaden index.html openen, of een simpele lokale server starten.'; }
 else if (/^(JavaScript|TypeScript|Vue|Svelte)$/.test(l)) { cmd = cl+'npm install\nnpm start   # of: npm run dev'; how='Vereist Node.js.'; }
 else if (l==='Python') { cmd = cl+'pip install -r requirements.txt\npython main.py   # kijk in de README welk bestand'; how='Vereist Python 3.'; }
 else if (l==='Rust') { cmd = cl+'cargo run --release'; how='Vereist Rust (rustup.rs).'; }
 else if (l==='Go') { cmd = cl+'go run .'; how='Vereist Go.'; }
 else if (/^(C\+\+|C)$/.test(l)) { cmd = cl+'cmake -B build\ncmake --build build --config Release'; how='Vereist een C/C++-compiler en CMake. Bekijk de README voor afhankelijkheden.'; }
 else if (l==='C#') { cmd = r.engine&&r.engine.includes('Unity') ? '' : cl+'dotnet run'; how = r.engine&&r.engine.includes('Unity') ? 'Unity-project: open de map in Unity Hub met de juiste Unity-versie.' : 'Vereist de .NET SDK.'; }
 else if (l==='GDScript') { cmd=''; how='Godot-project: open project.godot in de Godot-editor en druk op F5.'; }
 else if (/^(Java|Kotlin)$/.test(l)) { cmd = cl+'./gradlew run   # of ./gradlew assembleDebug voor Android'; how='Vereist een JDK.'; }
 else if (l==='Lua') { cmd = cl+'love .'; how='Meestal een LÖVE-spel: installeer LÖVE (love2d.org).'; }
 else if (l==='Dart') { cmd = cl+'flutter pub get\nflutter run'; how='Vereist Flutter.'; }
 else if (l==='Swift') { cmd=''; how='Open het project in Xcode op een Mac.'; }
 steps.push(`<li><div><strong>Zelf installeren of bouwen</strong>${how}${cmd?`<pre>${esc(cmd)}<button class="btn copy">Kopieer</button></pre>`:''}</div></li>`);
 return steps.join('');
}
function openDetail(r){
 const f = (lbl,v)=>`<div><span>${lbl}</span>${esc(v)}</div>`;
 const facts = r.k==='game'
  ? [f('Soort',r.genre.join(', ')),f('Spelers',r.mp.join(', ')),f('Grafisch',r.gfx.join(', ')),f('Engine',r.engine.join(', ')),f('Status',r.status),f('Sterren',r.s.toLocaleString('nl-NL')),f('Aangemaakt',r.c),f('Bijgewerkt',r.p+' ('+ago(r.updM)+')'),f('Taal',r.l||'—'),f('Licentie',r.li||'geen')]
  : [f('Categorie',r.cat.join(', ')),f('Platform',r.plat.join(', ')),f('Hosting',r.self),f('Status',r.status),f('Sterren',r.s.toLocaleString('nl-NL')),f('Aangemaakt',r.c),f('Bijgewerkt',r.p+' ('+ago(r.updM)+')'),f('Taal',r.l||'—'),f('Licentie',r.li||'geen')];
 const ov = document.getElementById('overlay');
 ov.innerHTML = `<div class="ov" id="ovbg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">${r.i&&r.i.length?'<div class="gal" id="gal"></div>':cover(r,true)}<div class="in">
  <div><button class="btn x" id="close">Sluiten</button><h2 id="dlgT">${esc(r.n.replace(/[-_]/g,' '))}</h2><div class="own">${esc(r.f)}</div></div>
  <p>${esc(r.d)||'<i>Geen beschrijving opgegeven.</i>'}</p>
  <div class="facts">${facts.join('')}</div>
  ${r.t.length?`<div class="tags">${r.t.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  <h3 style="font-family:var(--display);margin:4px 0 0;font-size:18px">Zo start je het</h3>
  <ol class="steps">${buildSteps(r)}</ol>
  <div class="links"><a class="btn" href="https://github.com/${esc(r.f)}" target="_blank" rel="noopener">Bekijk op GitHub</a><a class="btn" href="https://github.com/${esc(r.f)}#readme" target="_blank" rel="noopener">README</a>${r.site?`<a class="btn" href="${esc(r.site)}" target="_blank" rel="noopener">Website</a>`:''}</div>
  <p class="note">Labels zoals genre, multiplayer en beta zijn afgeleid uit de beschrijving en onderwerpen van de repository. Controleer de README voor zekerheid.</p>
 </div></div></div>`;
 GAL = null; renderGal(r, 0);
 document.getElementById('close').focus();
 if (!r.i?.length && !r._shotTry && (r.live||r.m)) fetchShots(r).then(()=>{ if (r.i?.length && document.getElementById('dlgT')) { const c=document.querySelector('.dlg .cov'); if(c){ c.outerHTML='<div class="gal" id="gal"></div>'; renderGal(r,0);} } });
}
function closeOv(){ if (document.getElementById('lb')) { document.getElementById('lb').remove(); return; } document.getElementById('overlay').innerHTML=''; GAL=null; }

/* ---------- live scannen ---------- */
const REPO = 'Endless1977/github-repo-lib';
const OWNER = 'Endless1977';
const LS_KEY = 'repolib-extra-v1';
let QRY = {game:[], app:[], own:['user:'+OWNER]}, OVR = {};
let TOKEN = '';
const GAME_RX = /\b(game|games|spel|spellen|multiplayer|shooter|rpg|racing|race|arcade|platformer|puzzle|roguelike|beat.?em.?up|adventure|avontuur|dogfight|level|levels|boss|bazen)\b/i;
const RAWKEYS = ['k','n','f','d','t','l','s','c','p','h','g','a','li','o','m','i','nw','ic'];
const raw = r => { const o={}; for (const k of RAWKEYS) if (r[k]!==undefined && r[k]!=='' && !(Array.isArray(r[k])&&!r[k].length&&k==='i')) o[k]=r[k]; return o; };
const today = () => new Date().toISOString().slice(0,10);
const dayOffset = n => new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const subst = q => q.replace('{30d}', dayOffset(30)).replace('{1y}', dayOffset(365));
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}') || {}; } catch(_) { return {}; } }
function lsWrite(o){ try { localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; } catch(_) { return false; } }
let pending = 0; // aantal wijzigingen die nog niet in de repo staan
function applyOverride(rec){
 const o = OVR[rec.f]; if (!o) return rec;
 if (o.k) rec.k = o.k; if (o.d && !rec.d) rec.d = o.d; if (o.t) rec.t = [...new Set([...(rec.t||[]), ...o.t])];
 return rec;
}
/* resultaat van een zoekopdracht in de bibliotheek verwerken; geeft true terug als de repo nieuw is */
function mergeRepo(r, group){
 const f = r.full_name; if (OVR[f]?.skip) return false;
 const own = r.owner.login.toLowerCase() === OWNER.toLowerCase();
 const old = DATA.find(x=>x.f===f);
 let kind = old ? old.k : group;
 if (!old && (group==='own' || own)) kind = OVR[f]?.k || (GAME_RX.test([r.name, r.description||'', ...(r.topics||[])].join(' ')) ? 'game' : 'app');
 const rec = applyOverride({k:kind,n:r.name,f,d:(r.description||'').slice(0,220),t:(r.topics||[]).slice(0,14),l:r.language,s:r.stargazers_count,c:r.created_at.slice(0,10),p:r.pushed_at.slice(0,10),h:r.homepage||'',g:r.has_pages,a:r.archived,li:(r.license&&r.license.spdx_id)||'',o:r.owner.login});
 if (own) rec.m = 1;
 const store = lsRead();
 if (old) {
  const changed = old.s!==rec.s || old.p!==rec.p || old.d!==(rec.d||old.d) || old.a!==rec.a || old.h!==rec.h || old.g!==rec.g;
  rec.m = old.m || rec.m; rec.i = old.i; rec.nw = old.nw; rec.ic = old.ic; rec.d = rec.d || old.d;
  if (old.m) rec.t = [...new Set([...rec.t, ...old.t])];
  Object.assign(old, enrich(rec)); old.live = 1;
  if (changed) { store[f] = raw(old); lsWrite(store); pending++; }
  return false;
 }
 rec.nw = today(); rec.live = 1; rec._new = 1;
 DATA.push(enrich(rec)); store[f] = raw(rec); lsWrite(store); pending++;
 return true;
}
function openScan(){
 const ov = document.getElementById('overlay');
 const qs = [...(QRY[S.tab]||[]), ...(QRY.own||[])].map(subst);
 ov.innerHTML = `<div class="ov" id="ovbg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="scT"><div class="in">
  <div><button class="btn x" id="close">Sluiten</button><h2 id="scT">Live scannen op GitHub</h2></div>
  <p>Haalt actuele repositories op en voegt nieuwe toe aan de ${S.tab==='game'?'spellen':'apps'}. Eén zoekopdracht per regel, in GitHub-zoeksyntax. Repos van <code>user:</code>-regels worden automatisch als spel of app ingedeeld.</p>
  <label for="liveQ" style="font-weight:600">Zoekopdrachten</label>
  <textarea id="liveQ">${esc(qs.join('\n'))}</textarea>
  <div class="links"><button class="btn" data-pre="topic:${S.tab==='game'?'game':'self-hosted'} created:>${dayOffset(30)} stars:>3">+ Nieuw deze maand</button><button class="btn" data-pre="topic:multiplayer topic:html5 stars:>10">+ HTML5 multiplayer</button></div>
  <label for="tok" style="font-weight:600">GitHub-token (optioneel)</label>
  <input id="tok" type="password" autocomplete="off" placeholder="github_pat_… of ghp_…" style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 12px" value="${esc(TOKEN)}">
  <p class="note">Zonder token staat GitHub 10 zoekopdrachten per minuut toe. Met een token mag het vaker, en kun je de resultaten ook <b>blijvend in je repo opslaan</b> (het token heeft dan schrijfrechten op <code>${REPO}</code> nodig: <i>Contents: Read and write</i>). Het token blijft alleen in dit tabblad. Nieuwe resultaten worden meteen in deze browser bewaard, ook zonder token.</p>
  <div class="links"><button class="btn pri" id="go">Start scan</button><button class="btn" id="save" ${pending||Object.keys(lsRead()).length?'':'hidden'}>Opslaan in repo</button></div>
  <div class="log" id="log"></div>
 </div></div></div>`;
}
async function runScan(){
 const qs = document.getElementById('liveQ').value.split('\n').map(s=>s.trim()).filter(Boolean);
 TOKEN = document.getElementById('tok').value.trim();
 const log = document.getElementById('log'); const go = document.getElementById('go'); go.disabled = true;
 const addedBy = {game:0, app:0};
 log.textContent = '';
 for (const q of qs) {
  const group = /^(user|org):/i.test(q) ? 'own' : S.tab;
  log.textContent += `→ ${q} … `;
  try {
   const res = await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(subst(q))+'&sort=stars&per_page=100', {headers: Object.assign({Accept:'application/vnd.github+json'}, TOKEN?{Authorization:'Bearer '+TOKEN}:{})});
   if (res.status===403||res.status===429) { log.textContent += 'limiet bereikt. Wacht een minuut of vul een token in.\n'; break; }
   if (res.status===401) { log.textContent += 'token ongeldig.\n'; break; }
   if (!res.ok) { log.textContent += `fout ${res.status}\n`; continue; }
   const js = await res.json(); let n=0;
   for (const r of js.items||[]) { if (r.fork && group!=='own') continue; if (mergeRepo(r, group)) { n++; addedBy[DATA[DATA.length-1].k]++; } }
   log.textContent += `${(js.items||[]).length} gevonden, ${n} nieuw\n`;
  } catch(e) { log.textContent += 'geen verbinding (in de Claude-weergave geblokkeerd; werkt op GitHub Pages)\n'; break; }
 }
 const added = addedBy.game + addedBy.app;
 liveInfo = `Laatste scan ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}: ${addedBy.game} nieuwe spellen, ${addedBy.app} nieuwe apps`;
 log.textContent += `\nKlaar. ${addedBy.game} nieuwe spellen en ${addedBy.app} nieuwe apps. Ze staan bovenaan (sortering "Nieuw toegevoegd") met een label Nieuw, en zijn in deze browser bewaard.`;
 if (pending) log.textContent += TOKEN ? ` Klik "Opslaan in repo" om ze voor iedereen vast te leggen.` : ` Vul een token in en klik "Opslaan in repo" om ze voor iedereen vast te leggen.`;
 if (added) { S.sort = 'added'; document.getElementById('sort').value = 'added'; S.shown = 60; }
 document.getElementById('save').hidden = !(pending || Object.keys(lsRead()).length);
 go.disabled = false; renderAll();
}
function b64(str){ const b = new TextEncoder().encode(str); let bin=''; for (let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(bin); }
async function saveToRepo(){
 TOKEN = document.getElementById('tok').value.trim();
 const log = document.getElementById('log'), btn = document.getElementById('save');
 if (!TOKEN) { log.textContent += '\n\nVoor opslaan in de repo is een token nodig met schrijfrechten (Contents: Read and write) op '+REPO+'.'; document.getElementById('tok').focus(); return; }
 btn.disabled = true; log.textContent += '\n\nOpslaan in repo … ';
 const H = {Accept:'application/vnd.github+json', Authorization:'Bearer '+TOKEN};
 try {
  const cur = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json?ref=main`, {headers:H, cache:'no-store'});
  if (!cur.ok) throw new Error(cur.status===404?'repo of data.json niet gevonden':cur.status===401?'token ongeldig':'kan data.json niet lezen ('+cur.status+')');
  const meta = await cur.json();
  // eerst de nieuwste versie uit de repo erbij halen, zodat een tussentijdse dagelijkse scan niet verloren gaat
  try { const rr = await fetch(`https://api.github.com/repos/${REPO}/git/blobs/${meta.sha}`, {headers:Object.assign({}, H, {Accept:'application/vnd.github.raw+json'}), cache:'no-store'});
   if (rr.ok) for (const x of await rr.json()) if (!DATA.find(y=>y.f===x.f)) DATA.push(enrich(x)); } catch(_) {}
  const body = JSON.stringify(DATA.map(raw).sort((a,b)=>b.s-a.s));
  const put = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {method:'PUT', headers:H, body:JSON.stringify({message:`Bibliotheek bijgewerkt via live scan (${pending} wijzigingen)`, content:b64(body), sha:meta.sha, branch:'main'})});
  if (put.status===403||put.status===404) throw new Error('token mag niet schrijven in '+REPO+'. Geef het token "Contents: Read and write" op deze repo.');
  if (put.status===409) throw new Error('de repo is net tegelijk bijgewerkt. Probeer het nog een keer.');
  if (!put.ok) throw new Error('opslaan mislukt ('+put.status+')');
  lsWrite({}); pending = 0; DATA.forEach(r=>{ delete r.live; });
  log.textContent += 'gelukt. GitHub Pages toont de nieuwe versie binnen een paar minuten voor iedereen.';
  btn.hidden = true; renderAll();
 } catch(e) { log.textContent += e.message; }
 btn.disabled = false;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
 const t = e.target;
 if (t.closest('[data-stop]')) return;
 if (t.id==='lbClose' || t.id==='lb') { document.getElementById('lb').remove(); return; }
 const nv = t.closest('[data-nav]'); if (nv) { navGal(+nv.dataset.nav); return; }
 const th = t.closest('[data-th]'); if (th) { renderGal(GAL.r, +th.dataset.th); return; }
 if (t.closest('#galMain')) { openLB(); return; }
 const tab = t.closest('.tab'); if (tab) { S.tab = tab.dataset.k; document.body.classList.toggle('apps', S.tab==='app'); document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b===tab)); freshSel(); S.shown=60; renderAll(); return; }
 const ch = t.closest('[data-f]'); if (ch) { const s=S.sel[ch.dataset.f]; s.has(ch.dataset.v)?s.delete(ch.dataset.v):s.add(ch.dataset.v); S.shown=60; renderAll(); return; }
 const rm = t.closest('[data-rm]'); if (rm) { const k=rm.dataset.rm; if(k==='mine')S.mine=false; else if(k==='newOnly')S.newOnly=false; else if(k==='q'){S.q='';document.getElementById('q').value='';} else S.sel[k].delete(rm.dataset.v); renderAll(); return; }
 if (t.id==='newOnly') { S.newOnly=!S.newOnly; S.shown=60; renderAll(); return; }
 if (t.id==='save') { saveToRepo(); return; }
 if (t.id==='mine') { S.mine=!S.mine; S.shown=60; renderAll(); return; }
 if (t.id==='reset') { freshSel(); S.minStars=0; S.upd=0; S.age=0; S.mine=false; S.newOnly=false; S.q=''; document.getElementById('q').value=''; renderAll(); return; }
 if (t.id==='moreBtn') { S.shown+=60; renderGrid(); return; }
 if (t.id==='ftoggle') { document.getElementById('side').classList.toggle('closed'); return; }
 if (t.id==='scanBtn') { openScan(); return; }
 if (t.id==='go') { runScan(); return; }
 if (t.dataset.pre) { const ta=document.getElementById('liveQ'); ta.value = (ta.value.trim()+'\n'+t.dataset.pre).trim(); return; }
 if (t.id==='close' || t.id==='ovbg') { closeOv(); return; }
 if (t.classList.contains('copy')) { const txt=t.parentElement.firstChild.textContent; const ok=()=>{t.textContent='Gekopieerd';setTimeout(()=>t.textContent='Kopieer',1500)}; try{navigator.clipboard.writeText(txt).then(ok,()=>selectPre(t.parentElement))}catch(_){selectPre(t.parentElement)} return; }
 const c = t.closest('.card'); if (c) openDetail(LIST[+c.dataset.i]);
});
function selectPre(el){ const r=document.createRange(); r.selectNodeContents(el.firstChild); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOv(); if(GAL && (e.key==='ArrowRight'||e.key==='ArrowLeft')) navGal(e.key==='ArrowRight'?1:-1); if(e.key==='Enter' && e.target.classList?.contains('card')) openDetail(LIST[+e.target.dataset.i]); });
document.addEventListener('input', e=>{
 const t=e.target;
 if (t.id==='q') { S.q=t.value.trim(); S.shown=60; clearTimeout(t._t); t._t=setTimeout(renderAll,150); }
 if (t.id==='age') { const v=+t.value; S.age = v>=16?0:v; document.getElementById('ageO').textContent=S.age?S.age+' jaar':'alles'; clearTimeout(t._t); t._t=setTimeout(()=>{renderGrid();renderSideKeep()},120); }
 if (t.id==='stars') { S.minStars=STAR_STEPS[+t.value]; document.getElementById('starsO').textContent=S.minStars?fmtN(S.minStars):'alle'; clearTimeout(t._t); t._t=setTimeout(()=>{renderGrid();renderSideKeep()},120); }
});
document.addEventListener('change', e=>{ if(e.target.id==='upd'){S.upd=+e.target.value;renderAll();} if(e.target.id==='sort'){S.sort=e.target.value;renderGrid();} });
function renderSideKeep(){ const a=document.activeElement?.id; renderSide(); if(a) document.getElementById(a)?.focus(); }
if (matchMedia('(max-width:820px)').matches) document.getElementById('side').classList.add('closed');
async function boot(){
 document.getElementById('grid').innerHTML = '<div class="empty">Bibliotheek laden…</div>';
 const get = async (u, def) => { try { const r = await fetch(u+'?v='+Date.now(), {cache:'no-store'}); return r.ok ? await r.json() : def; } catch(_) { return def; } };
 const [data, q, o] = await Promise.all([get('data.json', null), get('queries.json', null), get('overrides.json', {})]);
 if (!data) { document.getElementById('grid').innerHTML = '<div class="empty">data.json kon niet worden geladen. Open de pagina via GitHub Pages, of start lokaal een server in de repo-map: <code>python -m http.server</code>.</div>'; return; }
 if (q) QRY = q; OVR = Object.fromEntries(Object.entries(o||{}).filter(([k])=>!k.startsWith('_')));
 DATA = data;
 // wijzigingen uit eerdere live scans in deze browser terugzetten
 const store = lsRead(), ls = {};
 for (const [f, rec] of Object.entries(store)) {
  const old = DATA.find(x=>x.f===f);
  if (!old) { DATA.push(rec); ls[f]=rec; }
  else if ((rec.p||'') > (old.p||'') || rec.s !== old.s) { Object.assign(old, rec, {i: old.i||rec.i, ic: old.ic||rec.ic}); ls[f]=rec; }
 }
 lsWrite(ls); pending = Object.keys(ls).length;
 DATA.forEach(enrich);
 renderAll();
}
boot();
</script>
