<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repo Bibliotheek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bibliotheek-console — vaste kop met tabs, filterkolom links, raster van "cartridges" rechts */
:root{
  --bg:#eef1ef; --panel:#ffffff; --sunk:#e3e8e5; --line:#cfd8d4; --fg:#13201f; --mute:#566764;
  --game:#b25f00; --game-soft:#f6e3c8; --app:#0f7a72; --app-soft:#cdebe7;
  --ok:#2f7d32; --warn:#9a5b00; --off:#7b7f86;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1416; --panel:#151d20; --sunk:#0b1012; --line:#26343a; --fg:#e4ece9; --mute:#8d9e9b;
  --game:#f0a443; --game-soft:#3a2a14; --app:#5cc6bd; --app-soft:#123331;
  --ok:#7cc47f; --warn:#e7b25c; --off:#8b9096; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1416; --panel:#151d20; --sunk:#0b1012; --line:#26343a; --fg:#e4ece9; --mute:#8d9e9b;
  --game:#f0a443; --game-soft:#3a2a14; --app:#5cc6bd; --app-soft:#123331;
  --ok:#7cc47f; --warn:#e7b25c; --off:#8b9096; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body.apps{--acc:var(--app);--acc-soft:var(--app-soft)} body{--acc:var(--game);--acc-soft:var(--game-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:22px;height:22px;display:inline-grid;grid-template-columns:1fr 1fr;gap:2px}
.brand i b{background:var(--game);border-radius:1px}.brand i b:nth-child(2),.brand i b:nth-child(3){background:var(--app)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:8px}
.tab{border:0;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.tab[aria-selected="true"] span{color:var(--acc)}
.tab span{font-family:var(--mono);font-size:12px;margin-left:6px;font-weight:500}
.search{flex:1 1 260px;display:flex;gap:8px;min-width:0}
.search input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.status{font-family:var(--mono);font-size:12px;color:var(--mute);padding-block:0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.status b{color:var(--fg);font-weight:500}
.status .live{color:var(--acc)}

main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding-block:20px 60px}
aside{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;padding-right:6px}
.fg h3{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--fg)}
.chip[aria-pressed="true"] small{color:var(--fg)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.row output{font-family:var(--mono);font-size:12px;color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start;font-size:13px}
.ftoggle{display:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.toolbar h2{font-family:var(--display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.toolbar h2 span{font-family:var(--mono);font-size:14px;color:var(--mute);font-weight:400;margin-left:8px}
.toolbar select{width:auto}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.active .chip{background:var(--acc-soft);border-color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.cov{aspect-ratio:16/8;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h) 55% 26%),hsl(calc(var(--h) + 50) 60% 14%))}
.cov::before{content:"";position:absolute;inset:0;opacity:.35}
.cov.px::before{background:conic-gradient(from 90deg at 50% 50%,#fff2 25%,#0000 0 50%,#fff2 0 75%,#0000 0) 0 0/14px 14px}
.cov.d3::before{background:repeating-linear-gradient(90deg,#fff3 0 1px,#0000 1px 28px),repeating-linear-gradient(0deg,#fff3 0 1px,#0000 1px 18px);transform:perspective(160px) rotateX(55deg) scale(2.2) translateY(20%)}
.cov.vx::before{background:linear-gradient(30deg,#fff2 12%,#0000 12.5% 87%,#fff2 87.5%),linear-gradient(150deg,#fff2 12%,#0000 12.5% 87%,#fff2 87.5%),linear-gradient(90deg,#0002 2px,#0000 2px) 0 0/34px 20px;background-size:34px 20px}
.cov.tx::before{background:repeating-linear-gradient(0deg,#fff2 0 2px,#0000 2px 9px)}
.cov.d2::before{background:radial-gradient(circle at 20% 70%,#fff3 0 18%,#0000 19%),radial-gradient(circle at 80% 25%,#fff2 0 12%,#0000 13%)}
.cov.ap::before{background:linear-gradient(#fff2 1px,#0000 1px) 0 0/100% 22px}
.mono{position:relative;font-family:var(--display);font-weight:700;font-size:44px;color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 #0005;text-transform:uppercase}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#000a;color:#fff}
.bdg.beta{background:#e7b25c;color:#1d1300}.bdg.mp{background:#5cc6bd;color:#00201d}.bdg.arc{background:#8b9096;color:#111}.bdg.mine{background:#fff;color:#111}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cb h4{margin:0;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.own{font-family:var(--mono);font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
.desc{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--fg)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;gap:10px}
.launch{font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;text-decoration:none;white-space:nowrap}
.launch.on{background:var(--acc);color:#111}
.launch.ins{border:1px solid var(--line);color:var(--fg)}
.more{display:flex;justify-content:center;margin-top:22px}
.empty{padding:40px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}

.ov{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:100%;overflow:auto}
.dlg .cov{aspect-ratio:16/5}
.dlg .in{padding:18px 22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-family:var(--display);margin:0;font-size:26px;overflow-wrap:anywhere}
.dlg p{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;background:var(--sunk);border-radius:8px;padding:12px}
.facts div{font-size:13px;min-width:0;overflow-wrap:anywhere}.facts span{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;width:26px;height:26px;border-radius:6px;background:var(--acc-soft);color:var(--fg);display:grid;place-items:center}
.steps strong{display:block;margin-bottom:3px}
pre{margin:6px 0 0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;position:relative;white-space:pre}
.copy{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 7px}
.dlg .x{float:right}
.note{font-size:13px;color:var(--mute);background:var(--sunk);border-radius:8px;padding:10px 12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none}
textarea{width:100%;min-height:110px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;color:var(--fg)}
.log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--mute)}

/* screenshots */
.cov img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .25s}
.cov.has::after{content:"";position:absolute;inset:0;background:linear-gradient(#0008,#0000 40%,#0000 70%,#0007);pointer-events:none}
.cov.has .badges,.cov.has .shotn,.cov.has .dots{z-index:2}
.shotn{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:10.5px;background:#000b;color:#fff;padding:2px 6px;border-radius:4px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;opacity:0;transition:opacity .2s}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6}.dots i.on{background:#fff}
.card:hover .dots{opacity:1}.card:hover .shotn{opacity:0}
.gal{display:flex;flex-direction:column;gap:8px;background:#000;padding-bottom:8px}
.gal .main{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;cursor:zoom-in;overflow:hidden;position:relative}
.gal .main img{width:100%;height:100%;object-fit:contain}
.gal .main .shotn{bottom:8px;right:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:0 8px}
.thumbs button{flex:0 0 auto;width:96px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#222;cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:40;background:#000e;display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:88vh;margin:auto;display:block;object-fit:contain}
.lb .nav{width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0008;color:#fff;font-size:22px;cursor:pointer}
.lb .lbx{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#0008;color:#fff;border-color:#fff4}
.lb .cnt{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--mono);font-size:12px}

@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;overflow:visible;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  aside.closed{display:none}
  .ftoggle{display:inline-block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="bar">
   <div class="brand"><i><b></b><b></b><b></b><b></b></i>Repo Bibliotheek</div>
   <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-game" aria-selected="true" data-k="game">Spellen<span id="n-game"></span></button>
    <button class="tab" role="tab" id="tab-app" aria-selected="false" data-k="app">Apps<span id="n-app"></span></button>
   </div>
   <div class="search">
    <input id="q" type="search" placeholder="Zoek op naam, beschrijving of onderwerp…" autocomplete="off">
    <button class="btn" id="scanBtn" title="Haal actuele repositories op bij GitHub">Live scannen</button>
   </div>
  </div>
  <div class="status" id="status"></div>
 </div>
</header>

<div class="wrap">
 <main>
  <aside id="side"></aside>
  <section>
   <div class="toolbar">
    <h2 id="heading"></h2>
    <div style="display:flex;gap:8px;align-items:center">
     <button class="btn ftoggle" id="ftoggle">Filters</button>
     <label for="sort" style="color:var(--mute);font-size:13px">Sorteer</label>
     <select id="sort">
      <option value="stars">Meeste sterren</option>
      <option value="pushed">Recent bijgewerkt</option>
      <option value="new">Nieuwste eerst</option>
      <option value="old">Oudste eerst</option>
      <option value="name">Naam A–Z</option>
     </select>
    </div>
   </div>
   <div class="active" id="active"></div>
   <div class="grid" id="grid"></div>
   <div class="more"><button class="btn" id="moreBtn" hidden>Meer tonen</button></div>
  </section>
 </main>
</div>
<div id="overlay"></div>

async function fetchShots(r){

  try {
   const res = await fetch(`https://raw.githubusercontent.com/${r.f}/HEAD/${name}`); if (!res.ok) continue;
   const txt = await res.text(), base = `https://raw.githubusercontent.com/${r.f}/HEAD/`;
   const urls = [...txt.matchAll(/!\[[^\]]*\]\(\s*<?([^)\s>]+)/g)].map(m=>m[1]).concat([...txt.matchAll(/<img[^>]+src\s*=\s*["']([^"']+)/gi)].map(m=>m[1]));
   const out = [];
   for (let u of urls) {
    u = u.trim(); if (u.startsWith('data:') || SHOT_BAD.test(u)) continue;
    if (u.startsWith('//')) u = 'https:'+u;
    if (!/^https?:/.test(u)) u = new URL(u.replace(/^\.\//,''), base).href;
    const m = u.match(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/(.+?)(\?.*)?$/); if (m) u = `https://raw.githubusercontent.com/${m[1]}/${m[2]}`;

}

   if (!res.ok) { log.textContent += `fout ${res.status}\n`; continue; }
   const js = await res.json(); let n=0;
   for (const r of js.items||[]) {
    if (r.fork) continue;
    const old = DATA.find(x=>x.f===r.full_name);
    const rec = {k:old?old.k:S.tab,n:r.name,f:r.full_name,d:(r.description||'').slice(0,220),t:(r.topics||[]).slice(0,14),l:r.language,s:r.stargazers_count,c:r.created_at.slice(0,10),p:r.pushed_at.slice(0,10),h:r.homepage||'',g:r.has_pages,a:r.archived,li:(r.license&&r.license.spdx_id)||'',o:r.owner.login,live:1};
    if (old) { rec.m = old.m; rec.i = old.i; if (old.m) { rec.t = [...new Set([...rec.t,...old.t])]; rec.d = rec.d || old.d; } Object.assign(old, enrich(rec)); }
    else { DATA.push(enrich(rec)); n++; }
   }
   added += n; log.textContent += `${js.items.length} gevonden, ${n} nieuw\n`;
  } catch(e) { log.textContent += 'geen verbinding (geblokkeerd in deze weergave)\n'; liveInfo='Live scan niet beschikbaar in deze weergave'; break; }
 }
 if (added) liveInfo = `Laatste scan: ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`;
 go.disabled = false; renderAll();
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
 const t = e.target;
 if (t.closest('[data-stop]')) return;
 if (t.id==='lbClose' || t.id==='lb') { document.getElementById('lb').remove(); return; }
 const nv = t.closest('[data-nav]'); if (nv) { navGal(+nv.dataset.nav); return; }
 const th = t.closest('[data-th]'); if (th) { renderGal(GAL.r, +th.dataset.th); return; }
 if (t.closest('#galMain')) { openLB(); return; }
 const tab = t.closest('.tab'); if (tab) { S.tab = tab.dataset.k; document.body.classList.toggle('apps', S.tab==='app'); document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b===tab)); freshSel(); S.shown=60; renderAll(); return; }
 const ch = t.closest('[data-f]'); if (ch) { const s=S.sel[ch.dataset.f]; s.has(ch.dataset.v)?s.delete(ch.dataset.v):s.add(ch.dataset.v); S.shown=60; renderAll(); return; }
 const rm = t.closest('[data-rm]'); if (rm) { const k=rm.dataset.rm; if(k==='mine')S.mine=false; else if(k==='q'){S.q='';document.getElementById('q').value='';} else S.sel[k].delete(rm.dataset.v); renderAll(); return; }
 if (t.id==='mine') { S.mine=!S.mine; S.shown=60; renderAll(); return; }
 if (t.id==='reset') { freshSel(); S.minStars=0; S.upd=0; S.age=0; S.mine=false; S.q=''; document.getElementById('q').value=''; renderAll(); return; }
 if (t.id==='moreBtn') { S.shown+=60; renderGrid(); return; }
 if (t.id==='ftoggle') { document.getElementById('side').classList.toggle('closed'); return; }
 if (t.id==='scanBtn') { openScan(); return; }
 if (t.id==='go') { runScan(); return; }
 if (t.dataset.pre) { const ta=document.getElementById('liveQ'); ta.value = (ta.value.trim()+'\n'+t.dataset.pre).trim(); return; }
 if (t.id==='close' || t.id==='ovbg') { closeOv(); return; }
 if (t.classList.contains('copy')) { const txt=t.parentElement.firstChild.textContent; const ok=()=>{t.textContent='Gekopieerd';setTimeout(()=>t.textContent='Kopieer',1500)}; try{navigator.clipboard.writeText(txt).then(ok,()=>selectPre(t.parentElement))}catch(_){selectPre(t.parentElement)} return; }
 const c = t.closest('.card'); if (c) openDetail(LIST[+c.dataset.i]);
});
function selectPre(el){ const r=document.createRange(); r.selectNodeContents(el.firstChild); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOv(); if(GAL && (e.key==='ArrowRight'||e.key==='ArrowLeft')) navGal(e.key==='ArrowRight'?1:-1); if(e.key==='Enter' && e.target.classList?.contains('card')) openDetail(LIST[+e.target.dataset.i]); });
document.addEventListener('input', e=>{
 const t=e.target;
 if (t.id==='q') { S.q=t.value.trim(); S.shown=60; clearTimeout(t._t); t._t=setTimeout(renderAll,150); }
 if (t.id==='age') { const v=+t.value; S.age = v>=16?0:v; document.getElementById('ageO').textContent=S.age?S.age+' jaar':'alles'; clearTimeout(t._t); t._t=setTimeout(()=>{renderGrid();renderSideKeep()},120); }
 if (t.id==='stars') { S.minStars=STAR_STEPS[+t.value]; document.getElementById('starsO').textContent=S.minStars?fmtN(S.minStars):'alle'; clearTimeout(t._t); t._t=setTimeout(()=>{renderGrid();renderSideKeep()},120); }
});
document.addEventListener('change', e=>{ if(e.target.id==='upd'){S.upd=+e.target.value;renderAll();} if(e.target.id==='sort'){S.sort=e.target.value;renderGrid();} });
function renderSideKeep(){ const a=document.activeElement?.id; renderSide(); if(a) document.getElementById(a)?.focus(); }
if (matchMedia('(max-width:820px)').matches) document.getElementById('side').classList.add('closed');
renderAll();
</script>
