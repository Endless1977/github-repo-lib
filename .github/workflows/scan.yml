name: Bibliotheek scannen

on:
  schedule:
    - cron: '17 4 * * *'   # elke dag rond 05:17 Nederlandse tijd
  workflow_dispatch:        # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GitHub scannen
        run: python scripts/scan.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resultaten opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Bibliotheek bijgewerkt door dagelijkse scan"
          git pull --rebase origin main
          git push
